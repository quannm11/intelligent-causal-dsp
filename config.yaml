project:
  name: "uplift_bidding_agent"
  version: "1.0.0"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed/test_data.parquet"
  models_dir: "models"
  output_dir: "output"

modeling:
  test_size: 0.2
  random_state: 42
  validation_folds: 5

hyperparameters:
  t_learner:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.1
  x_learner:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.05

simulation:
  budget: 10000
  cost_threshold: 0.10
  revenue_per_conversion: 10.0